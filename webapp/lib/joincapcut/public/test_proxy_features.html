<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Proxy Features - CapCut Auto Join</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 Test Proxy Features</h1>
            <p>Kiểm tra tính năng lấy proxy free và kiểm tra live</p>
            <div style="margin-top: 15px;">
                <a href="index.html" class="nav-link">
                    🚀 Về Trang Chính
                </a>
            </div>
        </div>
        
        <div class="alert-warning" style="background-color: #d1ecf1; border: 1px solid #bee5eb; border-radius: 8px; padding: 15px; margin-bottom: 20px; color: #0c5460;">
            <h4 style="margin: 0 0 8px 0; font-size: 16px;">ℹ️ Hướng dẫn sử dụng:</h4>
            <p style="margin: 0 0 8px 0; font-size: 14px;">• <strong>Lấy Proxy Free:</strong> Tự động lấy 10 proxy từ fineproxy.org</p>
            <p style="margin: 0 0 8px 0; font-size: 14px;">• <strong>Kiểm Tra Live:</strong> Test proxy để xem còn hoạt động không</p>
            <p style="margin: 0; font-size: 14px;">• <strong>Kết quả:</strong> Chỉ giữ lại proxy live để sử dụng</p>
        </div>
        
        <div class="form-group">
            <label>🆓 Lấy Proxy Free</label>
            <button id="testGetFreeBtn" class="btn-secondary" style="width: 100%; margin-bottom: 10px;">
                Lấy 10 Proxy Free từ fineproxy.org
            </button>
            <div id="freeProxyResult" style="background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; white-space: pre-wrap;"></div>
        </div>
        
        <div class="form-group">
            <label>✅ Kiểm Tra Proxy Live</label>
            <textarea id="testProxies" placeholder="Nhập danh sách proxy để test (mỗi dòng một proxy)" rows="3" style="width: 100%; margin-bottom: 10px;"></textarea>
            <button id="testCheckBtn" class="btn-secondary" style="width: 100%; margin-bottom: 10px;">
                Kiểm Tra Live
            </button>
            <div id="checkProxyResult" style="background: #f8f9fa; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; white-space: pre-wrap;"></div>
        </div>
        
        <div class="form-group">
            <label>📊 Thống Kê</label>
            <div id="statsResult" style="background: #e9ecef; padding: 10px; border-radius: 5px; font-size: 14px;"></div>
        </div>
    </div>

    <script>
        document.getElementById('testGetFreeBtn').addEventListener('click', async function() {
            const btn = this;
            const result = document.getElementById('freeProxyResult');
            
            btn.disabled = true;
            btn.textContent = '🔄 Đang lấy...';
            result.textContent = '⏳ Đang lấy proxy free từ fineproxy.org...';
            
            try {
                const response = await fetch('/api/free-proxies?count=10');
                const data = await response.json();
                
                if (data.success) {
                    result.textContent = `✅ Thành công!\n\nSố lượng: ${data.count}\nNguồn: ${data.source}\n\nDanh sách proxy:\n${data.proxies.map(p => `${p.ip}:${p.port} (${p.type}, ${p.country})`).join('\n')}`;
                } else {
                    result.textContent = `❌ Lỗi: ${data.error}`;
                }
            } catch (error) {
                result.textContent = `❌ Lỗi: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Lấy 10 Proxy Free từ fineproxy.org';
            }
        });
        
        document.getElementById('testCheckBtn').addEventListener('click', async function() {
            const btn = this;
            const result = document.getElementById('checkProxyResult');
            const textarea = document.getElementById('testProxies');
            
            const proxyText = textarea.value.trim();
            if (!proxyText) {
                result.textContent = '⚠️ Vui lòng nhập danh sách proxy trước';
                return;
            }
            
            const proxies = proxyText.split('\n').filter(line => line.trim());
            if (proxies.length === 0) {
                result.textContent = '⚠️ Không có proxy hợp lệ nào';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '🔄 Đang kiểm tra...';
            result.textContent = `⏳ Đang kiểm tra ${proxies.length} proxy...`;
            
            try {
                const response = await fetch('/api/check-proxies', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ proxies })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    let resultText = `✅ Kiểm tra hoàn tất!\n\n`;
                    resultText += `Tổng số: ${data.totalCount}\n`;
                    resultText += `Live: ${data.liveCount}\n`;
                    resultText += `Tỷ lệ: ${((data.liveCount / data.totalCount) * 100).toFixed(1)}%\n\n`;
                    resultText += `Chi tiết:\n`;
                    
                    data.results.forEach((r, index) => {
                        const status = r.live ? '✅' : '❌';
                        const info = r.live ? `IP: ${r.ip}` : `Lỗi: ${r.error}`;
                        resultText += `${status} ${r.proxy} - ${info}\n`;
                    });
                    
                    result.textContent = resultText;
                    
                    // Cập nhật stats
                    document.getElementById('statsResult').innerHTML = `
                        <strong>📊 Thống kê:</strong><br>
                        Tổng proxy: <span style="color: #007bff;">${data.totalCount}</span><br>
                        Proxy live: <span style="color: #28a745;">${data.liveCount}</span><br>
                        Proxy chết: <span style="color: #dc3545;">${data.totalCount - data.liveCount}</span><br>
                        Tỷ lệ thành công: <span style="color: ${data.liveCount > 0 ? '#28a745' : '#dc3545'};">${((data.liveCount / data.totalCount) * 100).toFixed(1)}%</span>
                    `;
                } else {
                    result.textContent = `❌ Lỗi: ${data.error}`;
                }
            } catch (error) {
                result.textContent = `❌ Lỗi: ${error.message}`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Kiểm Tra Live';
            }
        });
    </script>
</body>
</html>
