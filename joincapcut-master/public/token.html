<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace của tài khoản (Token)</title>
    <link rel="stylesheet" href="/public/styles.css" onerror="this.remove()">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .card { 
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        
        .card h2, .card h3 {
            color: #2d3748;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .card h2 {
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }
        
        .card h3 {
            font-size: 1.2em;
            color: #4a5568;
        }
        
        .row { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .row.two-cols {
            grid-template-columns: 1fr 1fr;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
            font-size: 14px;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 12px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        
        .btn-danger:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }
        
        .list { 
            display: grid; 
            gap: 12px;
        }
        
        .item { 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 16px;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }
        
        .item:hover {
            background: rgba(255, 255, 255, 0.8);
            border-color: #667eea;
        }
        
        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .member-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #e2e8f0;
        }
        
        .mono { 
            font-family: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono", monospace; 
            word-break: break-all;
            background: #f7fafc;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        .small { 
            font-size: 13px; 
            color: #718096;
        }
        
        .tag { 
            display: inline-block; 
            padding: 4px 10px; 
            border-radius: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 11px; 
            font-weight: 500;
            margin-left: 8px;
        }
        
        .tag.vip {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .status {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        
        .status.success {
            background: rgba(72, 187, 120, 0.1);
            color: #2f855a;
            border: 1px solid rgba(72, 187, 120, 0.2);
        }
        
        .status.error {
            background: rgba(245, 101, 101, 0.1);
            color: #c53030;
            border: 1px solid rgba(245, 101, 101, 0.2);
        }
        
        .status.loading {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        
        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        
        .workspace-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }
        
        .workspace-item {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .workspace-item:hover {
            background: white;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .workspace-item.selected {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            
            .row.two-cols {
                grid-template-columns: 1fr;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .modal-message {
            color: #718096;
            font-size: 14px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn-cancel {
            background: #f7fafc;
            color: #4a5568;
            border: 1px solid #e2e8f0;
        }

        .modal-btn-cancel:hover {
            background: #edf2f7;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .modal-btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
        }

        .modal-btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .modal-btn-warning {
            background: linear-gradient(135deg, #f6ad55 0%, #ed8936 100%);
            color: white;
        }

        .modal-btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(246, 173, 85, 0.4);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1001;
            max-width: 300px;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            border-left-color: #48bb78;
        }

        .toast.error {
            border-left-color: #f56565;
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast-icon {
            font-size: 20px;
        }

        .toast-message {
            font-size: 14px;
            color: #2d3748;
            font-weight: 500;
        }

        /* Custom Select Styles */
        .role-select {
            padding: 8px 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 12px;
            background: white;
            color: #4a5568;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23666' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 16px;
            padding-right: 32px;
        }

        .role-select:hover {
            border-color: #667eea;
            background-color: #f7fafc;
        }

        .role-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background-color: white;
        }

        .role-select option {
            padding: 8px 12px;
            background: white;
            color: #4a5568;
        }

        .role-select option:hover {
            background: #f7fafc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🔑 Sử dụng Token</h2>
            <p class="small">Trang này cho phép xem workspace và thao tác theo token được cấp.</p>
            <div id="status" class="status loading">⏳ Đang tải...</div>
        </div>

        <div class="card">
            <h3>📋 Danh sách workspace</h3>
            <div class="button-group">
                <button class="btn" id="refreshBtn">🔄 Làm mới</button>
                <span class="small" style="align-self: center;">Chọn một workspace để thao tác</span>
            </div>
            <div id="workspaces" class="workspace-grid"></div>
        </div>

        <div class="card">
            <h3>🧰 Thao tác</h3>
            <div class="row">
                <div>
                    <label>Tên mới (đổi tên)</label>
                    <input id="newName" placeholder="Tên workspace mới" />
                </div>
            </div>
            <div class="row" style="margin-top:12px">
                <div>
                    <label>Email thành viên (mỗi dòng một email)</label>
                    <textarea id="memberEmails" placeholder="user1@example.com&#10;user2@example.com&#10;user3@example.com" rows="3"></textarea>
                </div>
            </div>
            <div class="button-group">
                <button class="btn" id="btnListMember">👥 Danh sách thành viên</button>
                <button class="btn" id="btnUpdateName">✏️ Cập nhật tên</button>
                <button class="btn" id="btnAddMember">➕ Thêm thành viên</button>
                <button class="btn" id="btnGetLink">🔗 Lấy link mời</button>
                <button class="btn" id="btnRefreshLink">🔄 Đổi link</button>
            </div>
        </div>

        <div class="card">
            <h3>👥 Thành viên <span id="memberCount" class="tag"></span></h3>
            <div id="members" class="list"></div>
        </div>

        <div class="card" style="display:none"></div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div id="modalIcon" class="modal-icon">⚠️</div>
                <div id="modalTitle" class="modal-title">Xác nhận</div>
                <div id="modalMessage" class="modal-message">Bạn có chắc chắn muốn thực hiện hành động này?</div>
            </div>
            <div class="modal-buttons">
                <button id="modalCancel" class="modal-btn modal-btn-cancel">Hủy</button>
                <button id="modalConfirm" class="modal-btn modal-btn-confirm">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <div class="toast-content">
            <div id="toastIcon" class="toast-icon">ℹ️</div>
            <div id="toastMessage" class="toast-message">Thông báo</div>
        </div>
    </div>

    <!-- Notice Bell and Panel -->
    <style>
        .notice-bell {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            box-shadow: 0 10px 25px rgba(102,126,234,0.35);
            cursor: pointer;
            z-index: 1002;
            user-select: none;
        }
        .notice-bell:hover { transform: translateY(-2px); }
        .notice-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #f56565;
            color: #fff;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 999px;
            box-shadow: 0 0 0 2px #fff;
        }
        .notice-panel {
            position: fixed;
            right: 20px;
            bottom: 84px;
            width: 360px;
            max-height: 60vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid #e2e8f0;
            padding: 12px;
            display: none;
            z-index: 1002;
        }
        .notice-panel.show { display: block; }
        .notice-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .notice-actions { display: flex; gap: 8px; }
        .notice-action-btn {
            border: 1px solid #e2e8f0;
            background: #f7fafc;
            color: #4a5568;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .notice-list { overflow: auto; max-height: calc(60vh - 48px); display: grid; gap: 10px; }
    </style>
    <div id="noticePanel" class="notice-panel">
        <div class="notice-panel-header">
            <div style="font-weight:600;color:#2d3748">Thông báo</div>
            <div class="notice-actions">
                <button id="noticeRefresh" class="notice-action-btn">Làm mới</button>
                <button id="noticeMore" class="notice-action-btn">Tải thêm</button>
            </div>
        </div>
        <div id="noticeList" class="notice-list"></div>
    </div>
    <div id="noticeBell" class="notice-bell" title="Thông báo">
        🔔
        <span id="noticeBadge" class="notice-badge" style="display:none">0</span>
    </div>

    <script>
        const token = location.pathname.split('/').pop();

        const el = (id) => document.getElementById(id);
        const statusEl = el('status');
        const listEl = el('workspaces');
        const membersEl = el('members');
        let selectedWorkspaceId = null;
        let selectedWorkspace = null;
        let workspaces = [];
        let noticeCursor = '0';
        let noticeHasMore = false;
        let noticeUnread = 0;

        // Modal functions
        function showModal(title, message, icon = '⚠️', confirmText = 'Xác nhận', confirmClass = 'modal-btn-confirm') {
            return new Promise((resolve) => {
                el('modalTitle').textContent = title;
                el('modalMessage').textContent = message;
                el('modalIcon').textContent = icon;
                el('modalConfirm').textContent = confirmText;
                el('modalConfirm').className = `modal-btn ${confirmClass}`;
                
                el('modal').classList.add('show');
                
                el('modalCancel').onclick = () => {
                    el('modal').classList.remove('show');
                    resolve(false);
                };
                
                el('modalConfirm').onclick = () => {
                    el('modal').classList.remove('show');
                    resolve(true);
                };
            });
        }

        // Toast functions
        function showToast(message, type = 'info', duration = 3000) {
            const toast = el('toast');
            const icon = el('toastIcon');
            const messageEl = el('toastMessage');
            
            messageEl.textContent = message;
            toast.className = `toast ${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            
            icon.textContent = icons[type] || icons.info;
            
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        function setOutput(data) {
            const out = document.getElementById('output');
            if (!out) return; // Kết quả đã bị ẩn/bỏ
            out.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        }

        async function fetchJson(url, options) {
            const r = await fetch(url, options);
            const contentType = r.headers.get('content-type') || '';
            const text = await r.text();
            try {
                return JSON.parse(text);
            } catch (e) {
                return { success: false, error: `Invalid JSON (${r.status})`, status: r.status, contentType, raw: text };
            }
        }

        async function loadInfo() {
            const info = await fetchJson(`/api/account/${token}/info`);
            if (!info.success) {
                statusEl.className = 'status error';
                statusEl.textContent = '❌ Token không hợp lệ hoặc đã hết hạn';
                return false;
            }
            statusEl.className = 'status success';
            statusEl.textContent = `✅ Token hợp lệ`;
            return true;
        }

        function renderWorkspaces(items) {
            listEl.innerHTML = '';
            items.forEach(w => {
                const div = document.createElement('div');
                div.className = 'workspace-item';
                div.innerHTML = `
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                <strong style="font-size: 16px; color: #2d3748;">${w.name || 'No name'}</strong>
                                ${w.team_vip_status === 1 ? '<span class="tag vip">VIP</span>' : ''}
                            </div>
                            <div class="small mono">ID: ${w.workspace_id}</div>
                            ${w.team_vip_end ? `
                                <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 12px; background: rgba(245, 87, 108, 0.1); border-radius: 8px; border: 1px solid rgba(245, 87, 108, 0.2);">
                                    <span class="tag vip" style="font-size: 11px; background: #f5576c; color: white;">VIP đến:</span>
                                    <span class="small" style="font-weight: 600; color: #f5576c; font-size: 12px;">
                                        ${new Date(w.team_vip_end*1000).toLocaleString('vi-VN', {
                                            year: 'numeric',
                                            month: '2-digit', 
                                            day: '2-digit',
                                            hour: '2-digit',
                                            minute: '2-digit',
                                            second: '2-digit'
                                        })}
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                        <button class="btn select-workspace-btn" data-workspace-id="${w.workspace_id}" data-workspace-name="${w.name}">Chọn workspace này</button>
                    </div>
                `;
                div.querySelector('button').addEventListener('click', async () => {
                    selectedWorkspaceId = w.workspace_id;
                    selectedWorkspace = w; // Lưu workspace được chọn
                    // Remove selected class from all items
                    document.querySelectorAll('.workspace-item').forEach(item => item.classList.remove('selected'));
                    // Add selected class to current item
                    div.classList.add('selected');
                    
                    // Cập nhật status với thông tin VIP
                    let statusText = `✅ Đã chọn: ${w.name} (${w.workspace_id})`;
                    if (w.team_vip_status === 1 && w.team_vip_end) {
                        const vipEndDate = new Date(w.team_vip_end * 1000).toLocaleString('vi-VN', {
                            year: 'numeric',
                            month: '2-digit',
                            day: '2-digit',
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        statusText += ` - VIP đến: ${vipEndDate}`;
                    }
                    statusEl.textContent = statusText;
                    
                    await listMembers(selectedWorkspaceId);
                });
                listEl.appendChild(div);
            });
            // nếu chưa có workspace chọn, auto chọn item đầu
            if (!selectedWorkspaceId && items.length > 0) {
                selectedWorkspaceId = items[0].workspace_id;
                selectedWorkspace = items[0]; // Lưu workspace đầu tiên
                // Auto select first item
                const firstItem = listEl.querySelector('.workspace-item');
                if (firstItem) {
                    firstItem.classList.add('selected');
                }
            }
        }

        function pickVipWorkspace(items) {
            const list = items || [];
            const vip = list.find(w => w.team_vip_status === 1);
            return vip || null;
        }

        async function loadWorkspaces() {
            const data = await fetchJson(`/api/account/${token}/workspaces`);
            if (!data.success) {
                setOutput(data);
                return [];
            }
            const items = data.workspaces || [];
            workspaces = items; // Lưu danh sách workspaces
            renderWorkspaces(items);
            return items;
        }

        function renderMemberList(memberList, workspaceId) {
            membersEl.innerHTML = '';
            const members = memberList || [];
            
            // Cập nhật số lượng thành viên
            const memberCountEl = document.getElementById('memberCount');
            if (memberCountEl) {
                // Tìm workspace để lấy member_limit
                const workspace = selectedWorkspace || workspaces.find(w => w.workspace_id === workspaceId);
                const maxMembers = workspace?.member_limit || 'N/A';
                memberCountEl.textContent = `${members.length}/${maxMembers}`;
            }
            
            members.forEach(m => {
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px; justify-content:space-between">
                        <div style="display:flex; align-items:center; gap:10px">
                            <img src="${m.avatar}" alt="avatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover" onerror="this.style.display='none'" />
                            <div>
                                <div><strong>${m.nickname || 'N/A'}</strong> <span class="tag">${m.role === 'admin' ? 'Quản trị viên' : m.role === 'collaborator' ? 'Cộng tác viên' : m.role === 'owner' ? 'Chủ sở hữu' : m.role}</span></div>
                                <div class="small mono">uid: ${m.uid}</div>
                                <div style="margin-top: 4px;">
                                    <select class="role-select" data-uid="${m.uid}" data-ws="${workspaceId}">
                                        <option value="collaborator" ${m.role === 'collaborator' ? 'selected' : ''}>Cộng tác viên</option>
                                        <option value="admin" ${m.role === 'admin' ? 'selected' : ''}>Quản trị viên</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button class="btn" data-uid="${m.uid}" data-ws="${workspaceId}">🗑️ Xoá</button>
                    </div>
                `;
                // Event listener cho select role
                item.querySelector('.role-select').addEventListener('change', async (ev) => {
                    const uid = ev.target.getAttribute('data-uid');
                    const ws = ev.target.getAttribute('data-ws');
                    const newRole = ev.target.value;
                    const memberName = m.nickname || 'N/A';
                    
                    const roleText = newRole === 'admin' ? 'Quản trị viên' : newRole === 'collaborator' ? 'Cộng tác viên' : newRole === 'owner' ? 'Chủ sở hữu' : newRole;
                    const confirmed = await showModal(
                        'Đổi vai trò thành viên',
                        `Bạn có chắc chắn muốn đổi vai trò của "${memberName}" thành "${roleText}"?`,
                        '👤',
                        'Đổi vai trò',
                        'modal-btn-confirm'
                    );
                    
                    if (confirmed) {
                        try {
                            const resp = await fetch(`/api/account/${token}/setrole`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ workspace_id: ws, uid, role: newRole })
                            });
                            const data = await resp.json();
                            if (data.success) {
                                showToast(`Đã đổi vai trò của ${memberName} thành ${roleText}`, 'success');
                                // Refresh member list
                                await listMembers(ws);
                            } else {
                                showToast(`Lỗi đổi vai trò: ${data.error || 'Không xác định'}`, 'error');
                                // Reset select về giá trị cũ
                                ev.target.value = m.role;
                            }
                        } catch (error) {
                            showToast(`Lỗi đổi vai trò: ${error.message}`, 'error');
                            // Reset select về giá trị cũ
                            ev.target.value = m.role;
                        }
                    } else {
                        // Reset select về giá trị cũ nếu user cancel
                        ev.target.value = m.role;
                    }
                });

                item.querySelector('button').addEventListener('click', async (ev) => {
                    const uid = ev.currentTarget.getAttribute('data-uid');
                    const ws = ev.currentTarget.getAttribute('data-ws');
                    const memberName = m.nickname || 'N/A';
                    
                    const confirmed = await showModal(
                        'Xóa thành viên',
                        `Bạn có chắc chắn muốn xóa thành viên "${memberName}" khỏi workspace?`,
                        '🗑️',
                        'Xóa',
                        'modal-btn-danger'
                    );
                    
                    if (confirmed) {
                        try {
                            const resp = await fetch(`/api/account/${token}/removeuser`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ workspace_id: ws, uid })
                            });
                            const data = await resp.json();
                            if (data.success) {
                                showToast(`Đã xóa thành viên ${memberName}`, 'success');
                            } else {
                                showToast(`Lỗi xóa thành viên: ${data.error || 'Không xác định'}`, 'error');
                            }
                            // refresh members
                            await listMembers(ws);
                        } catch (error) {
                            showToast(`Lỗi xóa thành viên: ${error.message}`, 'error');
                        }
                    }
                });
                membersEl.appendChild(item);
            });
        }

        async function listMembers(workspaceId) {
            if (!workspaceId) {
                membersEl.innerHTML = '<div class="small">⚠️ Chưa có workspace nào được chọn</div>';
                return;
            }
            let data;
            try {
                data = await fetchJson(`/api/account/${token}/listmember`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workspace_id: workspaceId, count: 200, cursor: '0' }) });
            } catch (e) {
                membersEl.innerHTML = `<div class="small">❌ Lỗi tải danh sách: ${e.message}</div>`;
                return;
            }
            setOutput(data);
            const memberList = data?.data?.data?.member_list || data?.data?.member_list || [];
            if (!Array.isArray(memberList) || memberList.length === 0) {
                membersEl.innerHTML = '<div class="small">📭 Không có thành viên hoặc dữ liệu không hợp lệ</div>';
                return;
            }
            renderMemberList(memberList, workspaceId);
        }

        function renderNotices(list) {
            const container = document.getElementById('noticeList');
            if (!container) return;
            if (!Array.isArray(list) || list.length === 0) {
                if (container.childElementCount === 0) {
                    container.innerHTML = '<div class="small">📭 Chưa có thông báo</div>';
                }
                return;
            }
            let newlyUnread = 0;
            list.forEach(n => {
                const c = n.content || {};
                const created = n.create_time ? new Date(n.create_time * 1000).toLocaleString('vi-VN') : '';
                const href = c.href || '';
                const title = c.title || 'Thông báo';
                const text = (c.text || '').replace(/\n/g, '<br/>' );
                const statusTag = n.status === false ? '<span class="tag" style="background:#ed8936">Mới</span>' : '';
                if (n.status === false) newlyUnread++;
                const detail = c.detail || {};
                const reply = detail.reply_to_user || {};
                const commentUser = detail.comment_user || {};
                let userInfoHtml = '';
                const parts = [];
                if (reply.user_id) {
                    parts.push(`Người nhận: ${reply.nick_name || 'N/A'} (uid: ${reply.user_id})`);
                }
                if (commentUser.user_id) {
                    parts.push(`Người gửi: ${commentUser.nick_name || 'N/A'} (uid: ${commentUser.user_id})`);
                }
                if (parts.length > 0) {
                    userInfoHtml = `<div class=\"small mono\" style=\"margin-top:4px;\">${parts.join('<br/>')}</div>`;
                }
                const item = document.createElement('div');
                item.className = 'item';
                item.innerHTML = `
                    <div style="display:flex; flex-direction:column; gap:8px">
                        <div style="display:flex; align-items:center; gap:8px; justify-content:space-between">
                            <div style="display:flex; align-items:center; gap:8px">
                                <strong style="color:#2d3748">${title}</strong>${statusTag}
                            </div>
                            <span class="small">${created}</span>
                        </div>
                        <div class="small" style="color:#4a5568">${text}</div>
                        ${userInfoHtml}
                        ${href ? `<a class=\"btn\" href=\"${href}\" target=\"_blank\" rel=\"noopener\">🔗 Xem chi tiết</a>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
            if (newlyUnread > 0) {
                noticeUnread += newlyUnread;
            }
            const badge = document.getElementById('noticeBadge');
            if (badge) {
                if (noticeUnread > 0) {
                    badge.style.display = 'inline-block';
                    badge.textContent = String(Math.min(99, noticeUnread));
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        async function loadNotices(reset = false) {
            try {
                const cursor = reset ? '0' : (noticeCursor || '0');
                const payload = { notice_type: [2, 3], cursor, count: 10 };
                const data = await fetchJson(`/api/account/${token}/notices`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const container = document.getElementById('noticeList');
                if (reset && container) container.innerHTML = '';
                if (!data.success) {
                    const hint = data?.raw && data.raw.startsWith('<!') ? ' (server trả về HTML)' : '';
                    showToast(`Lỗi tải thông báo: ${data.error || 'Không xác định'}${hint}`, 'error');
                    return;
                }
                const j = data.data || {};
                const noticeList = j?.data?.notice_list || [];
                noticeCursor = j?.data?.next_cursor ?? '0';
                noticeHasMore = !!j?.data?.has_more;
                renderNotices(noticeList);
                const btnMore = document.getElementById('noticeMore');
                if (btnMore) btnMore.disabled = !noticeHasMore;
            } catch (e) {
                showToast(`Lỗi tải thông báo: ${e.message}`, 'error');
            }
        }

        // Actions
        el('refreshBtn').addEventListener('click', async () => {
            const confirmed = await showModal(
                '⚠️ Cảnh báo làm mới',
                'Hạn chế chọn làm mới để tránh bị die login tài khoản. Khuyến nghị chỉ làm mới 1-5 lần/ngày.\n\nBạn có chắc chắn muốn tiếp tục?',
                '🔄',
                'Tiếp tục làm mới',
                'modal-btn-warning'
            );
            
            if (!confirmed) return;
            
            try {
                const result = await fetchJson(`/api/account/${token}/refresh-workspaces`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
                if (result.success) {
                    await loadWorkspaces();
                    showToast('Đã làm mới thành công! Cookie và workspace đã được cập nhật.', 'success');
                } else {
                    showToast(`Lỗi làm mới: ${result.error || 'Không xác định'}`, 'error');
                }
            } catch (error) {
                showToast(`Lỗi làm mới: ${error.message}`, 'error');
            }
        });
        el('btnListMember').addEventListener('click', async () => {
            if (!selectedWorkspaceId) {
                showToast('Vui lòng chọn workspace trước', 'warning');
                return;
            }
            await listMembers(selectedWorkspaceId);
        });
        el('btnUpdateName').addEventListener('click', async () => {
            const name = el('newName').value.trim();
            if (!selectedWorkspaceId || !name) {
                showToast('Vui lòng chọn workspace và nhập tên mới', 'warning');
                return;
            }
            const data = await fetchJson(`/api/account/${token}/updatename`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workspace_id: selectedWorkspaceId, name }) });
            if (data.success) {
                showToast('Cập nhật tên workspace thành công!', 'success');
                // Refresh workspace list để hiển thị tên mới
                await loadWorkspaces();
                // Clear input
                el('newName').value = '';
            } else {
                showToast(`Lỗi cập nhật tên: ${data.error || JSON.stringify(data)}`, 'error');
            }
        });

        el('btnAddMember').addEventListener('click', async () => {
            const emails = el('memberEmails').value.trim();
            if (!selectedWorkspaceId || !emails) {
                showToast('Vui lòng chọn workspace và nhập email thành viên', 'warning');
                return;
            }
            
            const emailList = emails.split('\n').map(e => e.trim()).filter(e => e);
            if (emailList.length === 0) {
                showToast('Vui lòng nhập ít nhất một email hợp lệ', 'warning');
                return;
            }
            
            const data = await fetchJson(`/api/account/${token}/addmember`, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ workspace_id: selectedWorkspaceId, emails: emailList }) 
            });
            
            if (data.success) {
                showToast(`Đã gửi lời mời cho ${emailList.length} thành viên thành công!`, 'success');
                // Clear input
                el('memberEmails').value = '';
                // Refresh member list
                await listMembers(selectedWorkspaceId);
            } else {
                showToast(`Lỗi thêm thành viên: ${data.error || JSON.stringify(data)}`, 'error');
            }
        });

        el('btnGetLink').addEventListener('click', async () => {
            if (!selectedWorkspaceId) {
                showToast('Vui lòng chọn workspace trước', 'warning');
                return;
            }
            
            try {
                const data = await fetchJson(`/api/account/${token}/getlink`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ workspace_id: selectedWorkspaceId }) 
                });
                
                if (data.success && data.data?.data?.invitation_link) {
                    const link = data.data.data.invitation_link;
                    const expireTime = data.data.data.expire_time;
                    const expireDate = new Date(expireTime * 1000).toLocaleString('vi-VN');
                    
                    // Copy link to clipboard (with fallback)
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(link);
                        } else {
                            const textArea = document.createElement('textarea');
                            textArea.value = link;
                            textArea.style.position = 'fixed';
                            textArea.style.left = '-999999px';
                            textArea.style.top = '-999999px';
                            document.body.appendChild(textArea);
                            textArea.focus();
                            textArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textArea);
                        }
                    } catch (e) {}
                    
                    showToast(`Đã copy link mời! Hết hạn: ${expireDate}`, 'success', 5000);
                    
                    // Show link in modal for confirmation
                    await showModal(
                        'Link mời workspace',
                        `Link: ${link}\n\nHết hạn: ${expireDate}`,
                        '🔗',
                        'Đã copy',
                        'modal-btn-confirm'
                    );
                } else {
                    showToast(`Lỗi lấy link: ${data.error || 'Không xác định'}`, 'error');
                }
            } catch (error) {
                showToast(`Lỗi lấy link: ${error.message}`, 'error');
            }
        });

        el('btnRefreshLink').addEventListener('click', async () => {
            if (!selectedWorkspaceId) {
                showToast('Vui lòng chọn workspace trước', 'warning');
                return;
            }
            
            const confirmed = await showModal(
                '🔄 Đổi link mời',
                'Bạn có chắc chắn muốn tạo link mời mới? Link cũ sẽ không còn hiệu lực.',
                '🔄',
                'Tạo link mới',
                'modal-btn-warning'
            );
            
            if (!confirmed) return;
            
            try {
                const data = await fetchJson(`/api/account/${token}/refreshlink`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ workspace_id: selectedWorkspaceId }) 
                });

                if (data.success && data.data?.data?.invitation_link) {
                    const link = data.data.data.invitation_link;
                    const expireTime = data.data.data.expire_time;
                    const expireDate = new Date(expireTime * 1000).toLocaleString('vi-VN');
                    
                    // Copy link to clipboard (with fallback)
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(link);
                        } else {
                            const textArea = document.createElement('textarea');
                            textArea.value = link;
                            textArea.style.position = 'fixed';
                            textArea.style.left = '-999999px';
                            textArea.style.top = '-999999px';
                            document.body.appendChild(textArea);
                            textArea.focus();
                            textArea.select();
                            document.execCommand('copy');
                            document.body.removeChild(textArea);
                        }
                    } catch (e) {}
                    
                    showToast(`Đã tạo link mời mới và copy vào clipboard! Hết hạn: ${expireDate}`, 'success', 5000);
                    
                    // Show link in modal for confirmation
                    await showModal(
                        'Link mời mới workspace',
                        `Link mới: ${link}\n\nHết hạn: ${expireDate}`,
                        '🔄',
                        'Đã copy',
                        'modal-btn-confirm'
                    );
                } else {
                    showToast(`Lỗi đổi link: ${data.error || 'Không xác định'}`, 'error');
                }
            } catch (error) {
                showToast(`Lỗi đổi link: ${error.message}`, 'error');
            }
        });

        // Notice events
        document.getElementById('noticeBell').addEventListener('click', () => {
            const panel = document.getElementById('noticePanel');
            if (!panel) return;
            const isOpen = panel.classList.contains('show');
            if (!isOpen) {
                // opening: reset unread badge
                noticeUnread = 0;
                const badge = document.getElementById('noticeBadge');
                if (badge) badge.style.display = 'none';
            }
            panel.classList.toggle('show');
        });
        document.getElementById('noticeRefresh').addEventListener('click', async () => {
            await loadNotices(true);
        });
        document.getElementById('noticeMore').addEventListener('click', async () => {
            if (noticeHasMore) await loadNotices(false);
        });

        // Close notice panel when clicking outside
        document.addEventListener('click', (ev) => {
            const panel = document.getElementById('noticePanel');
            const bell = document.getElementById('noticeBell');
            if (!panel || !bell) return;
            if (!panel.classList.contains('show')) return;
            const target = ev.target;
            if (!panel.contains(target) && !bell.contains(target)) {
                panel.classList.remove('show');
            }
        });

        (async () => {
            const ok = await loadInfo();
            if (!ok) return;
            const items = await loadWorkspaces();
            const vip = pickVipWorkspace(items);
            if (vip) {
                selectedWorkspaceId = vip.workspace_id;
                selectedWorkspace = vip;
                let statusText = `✅ Tự động chọn VIP: ${vip.name} (${vip.workspace_id})`;
                if (vip.team_vip_end) {
                    const vipEndDate = new Date(vip.team_vip_end * 1000).toLocaleString('vi-VN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    statusText += ` - VIP đến: ${vipEndDate}`;
                }
                statusEl.textContent = statusText;
                await listMembers(selectedWorkspaceId);
                await loadNotices(true);
            } else if (items.length > 0) {
                // không có VIP, auto chọn workspace đầu
                selectedWorkspaceId = items[0].workspace_id;
                selectedWorkspace = items[0];
                statusEl.textContent = `ℹ️ Không có VIP. Đã chọn: ${items[0].name || 'N/A'} (${selectedWorkspaceId})`;
                await listMembers(selectedWorkspaceId);
                await loadNotices(true);
            }
        })();
    </script>
</body>
</html>
