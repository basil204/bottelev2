<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Netflix Device Cookie Manager</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --panel: #131316;
        --panel-2: #19191d;
        --border: rgba(255, 255, 255, 0.09);
        --text: #f6f6f7;
        --muted: #9c9ca5;
        --accent: #e50914;
        --accent-hover: #f6121d;
        --success: #34d399;
        --warning: #fbbf24;
        --danger: #fb7185;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); }
      body {
        width: 390px;
        color: var(--text);
        font: 13px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .shell {
        padding: 16px;
        background: radial-gradient(circle at 90% 0%, rgba(229, 9, 20, 0.18), transparent 34%), linear-gradient(180deg, #101013 0%, #09090b 100%);
      }
      .header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      .header-copy { min-width: 0; flex: 1; }
      h1 { margin: 0; font-size: 16px; line-height: 1.25; font-weight: 750; letter-spacing: -0.02em; }
      .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
      .status-card {
        display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;
        padding: 12px 13px; border: 1px solid var(--border); border-radius: 13px; background: rgba(19, 19, 22, 0.88); box-shadow: var(--shadow);
      }
      .status-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
      #status {
        display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border-radius: 999px; color: #d7d7dc; background: #24242a; font-size: 11px; font-weight: 700; white-space: nowrap;
      }
      #status::before {
        content: ""; width: 7px; height: 7px; border-radius: 50%; background: #8b8b95; box-shadow: 0 0 0 3px rgba(139, 139, 149, 0.12);
      }
      #status[data-state="ready"] { color: #a7f3d0; background: rgba(52, 211, 153, 0.12); }
      #status[data-state="ready"]::before { background: var(--success); box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.13); }
      #status[data-state="warning"] { color: #fde68a; background: rgba(251, 191, 36, 0.12); }
      #status[data-state="warning"]::before { background: var(--warning); box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.12); }
      .panel { padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: rgba(19, 19, 22, 0.92); box-shadow: var(--shadow); }
      .panel-title { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
      .hint { margin: 0 0 12px; color: var(--muted); font-size: 11px; }
      label { display: block; margin-bottom: 6px; color: #d7d7dc; font-size: 11px; font-weight: 650; }
      textarea {
        width: 100%; min-height: 118px; padding: 11px 12px; resize: vertical; border: 1px solid var(--border); border-radius: 11px;
        outline: none; color: #ededf0; background: #0d0d10; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      textarea:focus { border-color: rgba(229, 9, 20, 0.64); box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.1); }
      .actions { display: grid; grid-template-columns: 1.3fr 1fr; gap: 8px; margin-top: 10px; }
      button {
        min-height: 39px; padding: 9px 12px; border: 1px solid transparent; border-radius: 10px; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
      }
      .primary { background: var(--accent); box-shadow: 0 8px 18px rgba(229, 9, 20, 0.2); }
      .secondary { border-color: var(--border); color: #e5e5e8; background: #232329; }
      #message { min-height: 18px; margin: 10px 2px 0; color: var(--muted); font-size: 11px; }
      #message[data-type="success"] { color: #a7f3d0; }
      #message[data-type="error"] { color: #fda4af; }
      .footer { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 11px; color: #71717a; font-size: 10px; }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="header-copy">
          <h1>Netflix Device Cookie Manager</h1>
          <p class="subtitle">Quản lý đầy đủ bộ cookie thiết bị</p>
        </div>
      </header>

      <section class="status-card" aria-label="Trạng thái">
        <span class="status-label">Trạng thái</span>
        <span id="status" data-state="loading">Đang kiểm tra…</span>
      </section>

      <section class="panel">
        <h2 class="panel-title">Cập nhật cookie</h2>
        <p class="hint">Dán JSON full cookie. Extension tách và giữ nguyên đầy đủ 6 cookie thiết bị.</p>

        <label for="cookieInput">Full cookie</label>
        <textarea
          id="cookieInput"
          placeholder='Dán JSON dạng {"url":"https://www.netflix.com","cookies":[…]}'
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>

        <div class="actions">
          <button class="primary" id="saveButton" type="button">Tách và lưu cookie</button>
          <button class="secondary" id="reloadButton" type="button">Tải lại Netflix</button>
        </div>

        <p id="message" role="status" aria-live="polite"></p>
      </section>

      <div class="footer">
        <span>Local storage</span>
        <span>•</span>
        <span>Không gửi dữ liệu ra ngoài</span>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
